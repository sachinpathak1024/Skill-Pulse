apiVersion: v1
kind: Service
metadata: 
  name: mysql-svc
  namespace: skillpulse-ns
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
---
apiVersion: v1
kind: Service
metadata: 
  name: backend-svc
  namespace: skillpulse-ns
spec:
  selector:
    app: backend-label
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata: 
  name: frontend-svc
  namespace: skillpulse-ns
spec:
  selector: 
    app: frontend-label
  # sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 3600
  # ports:
  #   - port: 3000
  #     nodePort: 30080
  # type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP