apiVersion: v1
kind: Service
metadata: 
  name: mysql-svc
  namespace: skillpulse-ns
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: v1
kind: Service
metadata: 
  name: backend-svc
  namespace: skillpulse-ns
spec:
  selector:
    app: backend
  ports:
    - name: backend
      port: 8080


---

apiVersion: v1
kind: Service
metadata: 
  name: frontend-svc
  namespace: skillpulse-ns
spec:
  selector: 
    app: frontend
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: 80
      nodePort: 30080
  type: NodePort