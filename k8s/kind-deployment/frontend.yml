apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: skillpulse-ns
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: sach990p/frontend:2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        envFrom:
          - configMapRef:
             name: skillpulse-cm
          - secretRef:
             name: skillpulse-secrets